services:
  xtts:
    build:
      context: ./services/xtts
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      COQUI_TOS_AGREED: ${COQUI_TOS_AGREED:?Review the XTTS-v2 CPML license and set COQUI_TOS_AGREED=1}
      XTTS_DEVICE: ${XTTS_DEVICE:-cpu}
      XTTS_PRELOAD_MODEL: "true"
      XTTS_SERVICE_API_KEY: ${XTTS_SERVICE_API_KEY:?Set XTTS_SERVICE_API_KEY}
    volumes:
      - xtts-models:/data/models
      - xtts-voices:/data/voices

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - xtts
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.xtts:/etc/caddy/Caddyfile:ro
      - xtts-caddy-data:/data
      - xtts-caddy-config:/config

volumes:
  xtts-models:
  xtts-voices:
  xtts-caddy-data:
  xtts-caddy-config:
